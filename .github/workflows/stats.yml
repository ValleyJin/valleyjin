name: Generate stats SVG

on:
  schedule:
    - cron: "23 6 * * *"        # daily, 06:23 UTC
  workflow_dispatch: {}
  push:
    branches: [ main ]
    paths: [ ".github/workflows/stats.yml" ]

permissions:
  contents: write

concurrency:
  group: stats-svg
  cancel-in-progress: true

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build stats SVGs
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const user = context.repo.owner;

            const { data: u } = await github.rest.users.getByUsername({ username: user });
            const repos = await github.paginate(github.rest.repos.listForUser,
              { username: user, type: 'owner', per_page: 100 });
            const own = repos.filter(r => !r.fork && !r.archived);
            const stars = own.reduce((s, r) => s + (r.stargazers_count || 0), 0);

            const bytes = {};
            for (const r of own.slice(0, 60)) {
              try {
                const { data: l } = await github.rest.repos.listLanguages({ owner: user, repo: r.name });
                for (const [k, v] of Object.entries(l)) bytes[k] = (bytes[k] || 0) + v;
              } catch (e) {}
            }
            const total = Object.values(bytes).reduce((a, b) => a + b, 0) || 1;
            const langs = Object.entries(bytes).sort((a, b) => b[1] - a[1]).slice(0, 5)
              .map(([name, b]) => ({ name, pct: Math.max(1, Math.round(b / total * 100)) }));

            let contributions = null;
            try {
              const q = `query($l:String!){user(login:$l){contributionsCollection{contributionCalendar{totalContributions}}}}`;
              const g = await github.graphql(q, { l: user });
              contributions = g.user.contributionsCollection.contributionCalendar.totalContributions;
            } catch (e) {}

            const comma = n => (n == null ? '—' : n.toLocaleString('en-US'));
            const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
            const stats = [
              { n: comma(contributions), l: 'Contributions' },
              { n: comma(u.public_repos), l: 'Repositories' },
              { n: comma(stars), l: 'Stars earned' },
              { n: comma(u.followers), l: 'Followers' },
            ];

            function svg(theme) {
              const c = theme === 'dark'
                ? { ink:'#e9e9ee', mut:'#7f818d', acc:'#6ad7c2', trk:'#20222b' }
                : { ink:'#16171b', mut:'#6b6d77', acc:'#0f8f79', trk:'#e6e6e4' };
              const colX = [6, 194, 382, 570];
              const statG = stats.map((s, i) =>
                `<text x="${colX[i]}" y="74" class="num">${esc(s.n)}</text>` +
                `<text x="${colX[i]}" y="96" class="lbl">${esc(s.l).toUpperCase()}</text>`).join('');
              const barW = 500, barX = 120;
              const bars = langs.map((L, i) => {
                const y = 152 + i * 20;
                return `<text x="6" y="${y+4}" class="lng">${esc(L.name)}</text>` +
                  `<rect x="${barX}" y="${y-3}" width="${barW}" height="7" rx="3.5" fill="${c.trk}"/>` +
                  `<rect x="${barX}" y="${y-3}" width="${Math.round(barW*L.pct/100)}" height="7" rx="3.5" fill="${c.acc}"/>` +
                  `<text x="${barX+barW+14}" y="${y+4}" class="pct">${L.pct}%</text>`;
              }).join('');
              return `<svg xmlns="http://www.w3.org/2000/svg" width="760" height="250" viewBox="0 0 760 250" role="img" aria-label="GitHub stats for ${user}">
<style>
.kick{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:12px;letter-spacing:2.5px;fill:${c.mut}}
.num{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:30px;font-weight:650;fill:${c.acc}}
.lbl{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:10px;letter-spacing:1.5px;fill:${c.mut}}
.lng{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:12px;fill:${c.ink}}
.pct{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:12px;fill:${c.mut}}
</style>
<text x="6" y="22" class="kick">GITHUB ACTIVITY · @${esc(user).toUpperCase()}</text>
${statG}
<line x1="6" y1="118" x2="746" y2="118" stroke="${c.trk}" stroke-width="1"/>
${bars}
</svg>`;
            }

            fs.mkdirSync('assets', { recursive: true });
            fs.writeFileSync('assets/stats-dark.svg', svg('dark') + '\n');
            fs.writeFileSync('assets/stats-light.svg', svg('light') + '\n');
            core.info('Wrote assets/stats-{dark,light}.svg');

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- assets/stats-dark.svg assets/stats-light.svg; then
            git add assets/stats-dark.svg assets/stats-light.svg
            git commit -m "chore: refresh stats SVG [skip ci]"
            git push
          else
            echo "No changes."
          fi
