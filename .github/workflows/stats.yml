name: Generate stats SVG

on:
  schedule:
    - cron: "23 6 * * *"        # daily, 06:23 UTC
  workflow_dispatch: {}
  push:
    branches: [ main ]
    paths: [ ".github/workflows/stats.yml" ]

permissions:
  contents: write

concurrency:
  group: stats-svg
  cancel-in-progress: true

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build stats SVGs
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const user = context.repo.owner;

            const { data: u } = await github.rest.users.getByUsername({ username: user });
            const repos = await github.paginate(github.rest.repos.listForUser,
              { username: user, type: 'owner', per_page: 100 });
            const own = repos.filter(r => !r.fork && !r.archived);
            const stars = own.reduce((s, r) => s + (r.stargazers_count || 0), 0);

            const bytes = {};
            for (const r of own.slice(0, 60)) {
              try {
                const { data: l } = await github.rest.repos.listLanguages({ owner: user, repo: r.name });
                for (const [k, v] of Object.entries(l)) bytes[k] = (bytes[k] || 0) + v;
              } catch (e) {}
            }
            const total = Object.values(bytes).reduce((a, b) => a + b, 0) || 1;
            const langs = Object.entries(bytes).sort((a, b) => b[1] - a[1]).slice(0, 5)
              .map(([name, b]) => ({ name, pct: Math.max(1, Math.round(b / total * 100)) }));

            let contributions = null;
            try {
              const q = 'query($l:String!){user(login:$l){contributionsCollection{contributionCalendar{totalContributions}}}}';
              const g = await github.graphql(q, { l: user });
              contributions = g.user.contributionsCollection.contributionCalendar.totalContributions;
            } catch (e) {}

            const comma = n => (n == null ? '—' : n.toLocaleString('en-US'));
            const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            const stats = [
              { n: comma(contributions), l: 'Contributions' },
              { n: comma(u.public_repos), l: 'Repositories' },
              { n: comma(stars), l: 'Stars earned' },
              { n: comma(u.followers), l: 'Followers' },
            ];

            // Theme is baked into each SVG via @media(prefers-color-scheme); <picture> in the
            // README swaps layouts by WIDTH only. This avoids GitHub dark-mode picking the
            // wrong (stacked) source from a width+theme "and"-combined media query.
            function themeStyle() {
              return '<style>'
                + ':root{--ink:#16171b;--mut:#6b6d77;--acc:#0f8f79;--trk:#e6e6e4;--p0:#0f8f79;--p1:#3aa593;--p2:#66ac9d;--p3:#9099a3;--p4:#c3c9d4}'
                + '@media(prefers-color-scheme:dark){:root{--ink:#e9e9ee;--mut:#7f818d;--acc:#6ad7c2;--trk:#20222b;--p0:#6ad7c2;--p1:#4fb3a3;--p2:#3d8f86;--p3:#586170;--p4:#3b414a}}'
                + '.kick{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;letter-spacing:2.5px;fill:var(--mut)}'
                + '.num{font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif;font-size:30px;font-weight:650;fill:var(--acc)}'
                + '.lbl{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10px;letter-spacing:1.5px;fill:var(--mut)}'
                + '.lng{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;fill:var(--ink)}'
                + '.pct{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;fill:var(--mut)}'
                + '.dv{stroke:var(--trk);stroke-width:1}'
                + '.s0{stroke:var(--p0)}.s1{stroke:var(--p1)}.s2{stroke:var(--p2)}.s3{stroke:var(--p3)}.s4{stroke:var(--p4)}'
                + '.g0{fill:var(--p0)}.g1{fill:var(--p1)}.g2{fill:var(--p2)}.g3{fill:var(--p3)}.g4{fill:var(--p4)}'
                + '</style>';
            }
            function donut(cx, cy, r, w) {
              const pt = a => [cx + r * Math.sin(a), cy - r * Math.cos(a)];
              const sumPct = langs.reduce((a, L) => a + L.pct, 0) || 1;
              let ang = 0, out = [];
              langs.forEach((L, i) => {
                const a1 = ang + (L.pct / sumPct) * Math.PI * 2;
                const [x0, y0] = pt(ang), [x1, y1] = pt(a1);
                const large = (a1 - ang) > Math.PI ? 1 : 0;
                out.push('<path class="s' + i + '" d="M ' + x0.toFixed(2) + ' ' + y0.toFixed(2) + ' A ' + r + ' ' + r + ' 0 ' + large + ' 1 ' + x1.toFixed(2) + ' ' + y1.toFixed(2) + '" fill="none" stroke-width="' + w + '"/>');
                ang = a1;
              });
              return out;
            }
            function legend(lx, y0, dy, pctX) {
              let out = [];
              langs.forEach((L, i) => {
                const y = y0 + i * dy;
                out.push('<rect class="g' + i + '" x="' + lx + '" y="' + (y - 9) + '" width="10" height="10" rx="2"/>');
                out.push('<text x="' + (lx + 18) + '" y="' + y + '" class="lng">' + esc(L.name) + '</text>');
                out.push('<text x="' + pctX + '" y="' + y + '" text-anchor="end" class="pct">' + L.pct + '%</text>');
              });
              return out;
            }
            function numbers(colX, rowY) {
              let out = [];
              stats.forEach((s, i) => {
                const x = colX[i % 2], y = rowY[Math.floor(i / 2)];
                out.push('<text x="' + x + '" y="' + y + '" class="num">' + esc(s.n) + '</text>');
                out.push('<text x="' + x + '" y="' + (y + 22) + '" class="lbl">' + esc(s.l).toUpperCase() + '</text>');
              });
              return out;
            }
            // wide (desktop): numbers left | pie right, divider aligned under README thumbnail
            function svgWide() {
              let p = ['<svg xmlns="http://www.w3.org/2000/svg" width="865" height="236" viewBox="0 0 865 236" role="img" aria-label="GitHub stats for ' + esc(user) + '">'];
              p.push(themeStyle());
              p.push('<text x="6" y="22" class="kick">GITHUB ACTIVITY · @' + esc(user).toUpperCase() + '</text>');
              p = p.concat(numbers([6, 190], [108, 186]));
              p.push('<line class="dv" x1="487" y1="56" x2="487" y2="214"/>');
              p = p.concat(donut(581, 135, 58, 20));
              p = p.concat(legend(673, 96, 20, 861));
              p.push('</svg>');
              return p.join('\n') + '\n';
            }
            // stacked (mobile): numbers on top, horizontal rule, pie below
            function svgStacked() {
              let p = ['<svg xmlns="http://www.w3.org/2000/svg" width="400" height="376" viewBox="0 0 400 376" role="img" aria-label="GitHub stats for ' + esc(user) + '">'];
              p.push(themeStyle());
              p.push('<text x="6" y="20" class="kick">GITHUB ACTIVITY · @' + esc(user).toUpperCase() + '</text>');
              p = p.concat(numbers([6, 208], [78, 146]));
              p.push('<line class="dv" x1="6" y1="196" x2="394" y2="196"/>');
              p = p.concat(donut(78, 288, 54, 20));
              p = p.concat(legend(176, 246, 22, 390));
              p.push('</svg>');
              return p.join('\n') + '\n';
            }

            fs.mkdirSync('assets', { recursive: true });
            fs.writeFileSync('assets/stats-wide.svg', svgWide());
            fs.writeFileSync('assets/stats-stacked.svg', svgStacked());
            core.info('Wrote assets/stats-wide.svg + stats-stacked.svg');

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats-wide.svg assets/stats-stacked.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh stats SVG [skip ci]"
            git push
          else
            echo "No changes."
          fi
