name: K3I stock badge

on:
  schedule:
    - cron: "*/15 0-7 * * 1-5"   # ~15분마다, KST 09:00–16:xx(UTC 00–07) 평일 (GitHub cron은 지연될 수 있음)
  workflow_dispatch: {}
  push:
    branches: [ main ]
    paths: [ ".github/workflows/stock.yml", "tools/gen_stock.py" ]

permissions:
  contents: write

concurrency:
  group: stock
  cancel-in-progress: true

jobs:
  quote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Fetch K3I (KOSDAQ 431190) quote → badge SVG
        run: python tools/gen_stock.py
      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/k3i-stock.svg
          if git diff --cached --quiet; then
            echo "No change."
          else
            # bust GitHub's image (camo) cache by bumping the ?t= query in the README
            TS=$(date +%s)
            sed -i "s|k3i-stock\.svg?t=[0-9]*|k3i-stock.svg?t=$TS|" README.md
            git add README.md
            git commit -m "chore: refresh K3I stock badge [skip ci]"
            git push
          fi
