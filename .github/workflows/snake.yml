name: Generate contribution snake

on:
  schedule:
    - cron: "17 */12 * * *"     # twice a day
  workflow_dispatch: {}
  push:
    branches: [ main ]
    paths: [ ".github/workflows/snake.yml" ]

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build snake SVGs (light + dark)
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/github-snake.svg
            assets/github-snake-dark.svg?palette=github-dark

      - name: Commit if changed
        run: |
          if ! git diff --quiet -- assets/github-snake.svg assets/github-snake-dark.svg; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add assets/github-snake.svg assets/github-snake-dark.svg
            git commit -m "chore: refresh contribution snake [skip ci]"
            git push
          else
            echo "No changes."
          fi
