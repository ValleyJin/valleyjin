name: Generate contribution snake

on:
  schedule:
    - cron: "17 */12 * * *"     # twice a day
  workflow_dispatch: {}
  push:
    branches: [ main ]
    paths: [ ".github/workflows/snake.yml" ]

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build snake SVGs (light + dark)
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/github-snake.svg?color_snake=#40c463&color_dots=#ebedf0,#9be9a8,#40c463,#30a14e,#216e39
            assets/github-snake-dark.svg?color_snake=#39d353&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/github-snake.svg assets/github-snake-dark.svg
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: refresh contribution snake [skip ci]"
            git push
          fi
