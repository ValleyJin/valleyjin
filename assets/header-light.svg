<svg xmlns="http://www.w3.org/2000/svg" width="880" height="212" viewBox="0 0 880 212" fill="none" role="img" aria-label="Jin Sam Cho — building at the intersection of AI, blockchain, and the physical world">
  <style>
    .kick{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:13px;letter-spacing:3px;fill:#6b6d77}
    .h{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:31px;font-weight:650;letter-spacing:-.5px;fill:#16171b}
    .a{fill:#0f8f79}
    .sub{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:14px;letter-spacing:.5px;fill:#6b6d77}
